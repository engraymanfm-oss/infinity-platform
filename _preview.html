<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:#0a0a0a;display:flex;gap:18px;padding:16px;font-family:sans-serif;color:#eee}
figure{margin:0}figcaption{font-size:12px;color:#9ab;margin-bottom:6px}
iframe{border:1px solid #234;background:#000;border-radius:10px}</style></head><body>
<figure><figcaption>mobile 390 × 844 — home</figcaption><iframe data-src="./index.html" width="390" height="844"></iframe></figure>
<figure><figcaption>mobile 390 × 844 — AI war</figcaption><iframe data-src="./index.html#/ai" width="390" height="844"></iframe></figure>
<script>
const v=Date.now();
document.querySelectorAll('iframe').forEach(f=>{ const s=f.dataset.src; const i=s.indexOf('#'); const base=i<0?s:s.slice(0,i); const hash=i<0?'':s.slice(i); f.src=base+'?v='+v+hash; });
</script>
</body></html>
