name: Update news data

on:
  schedule:
    # كل 4 ساعات (بتوقيت UTC؛ ما يوافق كل 4 ساعات بتوقيت الرياض أيضًا)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh the movie catalog (last 2 months + upcoming, with posters)
        continue-on-error: true
        run: python3 scripts/build_catalog.py

      - name: Refresh CURATED and SNAPSHOT from the feeds
        run: python3 scripts/update_news.py

      - name: Commit and push when the data changed
        run: |
          if git diff --quiet -- index.html; then
            echo "no change to index.html"
            exit 0
          fi
          git config user.name "Infinity Bot"
          git config user.email "engraymanfm-oss@users.noreply.github.com"
          git add index.html
          git add scripts/catalog.json scripts/poster-cache.json 2>/dev/null || true
          git commit -m "chore(news): تحديث تلقائي $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push

      - name: Rebuild the published site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # pushes made with GITHUB_TOKEN do not start other workflows, so ask Pages to build explicitly
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true
