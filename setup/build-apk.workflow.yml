name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
      - run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1); fi
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Infinity.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-apk
          path: Infinity.apk
          if-no-files-found: error
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.1 > /dev/null 2>&1 || \
            gh release create v2.1 --title "Infinity 2.1" \
              --notes "Infinity v2.1 — إصلاح صلاحية المايكروفون"
          gh release upload v2.1 Infinity.apk --clobber
