name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1); fi
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk ready: $SDK"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Infinity.apk
          ls -lh Infinity.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-apk
          path: Infinity.apk
          if-no-files-found: error

      - name: Publish GitHub Release v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0 > /dev/null 2>&1 || \
            gh release create v1.0 --title "Infinity 1.0" \
              --notes "تطبيق Infinity — المنصة الحية (أخبار ومقارنات). حمّل Infinity.apk وثبّته على أندرويد."
          gh release upload v1.0 Infinity.apk --clobber
